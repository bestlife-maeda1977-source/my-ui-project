<!doctype html>
<html lang="ja" class="h-full bg-gray-50">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>完了 | データチェック管理</title>
    <link rel="stylesheet" href="/src/assets/styles/style.css" />
  </head>
  <body class="h-full">
    <div
      class="flex min-h-full items-center justify-center py-12 px-4 sm:px-6 lg:px-8"
    >
      <div
        class="max-w-md w-full text-center bg-white p-8 shadow sm:rounded-xl"
      >
        <!-- 成功アイコン -->
        <div
          class="mx-auto flex h-16 w-16 items-center justify-center rounded-full bg-green-100 mb-6"
        >
          <svg
            class="h-10 w-10 text-green-600"
            fill="none"
            viewBox="0 0 24 24"
            stroke-width="2"
            stroke="currentColor"
            aria-hidden="true"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              d="M5 13l4 4L19 7"
            />
          </svg>
        </div>

        <!-- メッセージ -->
        <h2 class="text-2xl font-bold tracking-tight text-gray-900">
          保存が完了しました
        </h2>
        <p class="mt-2 text-sm text-gray-500">
          データの更新が正常にシステムに反映されました。<br />
          引き続き操作を行う場合は、以下のボタンを選択してください。
        </p>

        <!-- アクションボタン -->
        <div class="mt-10 space-y-3">
          <a
            href="/src/dashboard.html"
            class="flex w-full justify-center rounded-md bg-indigo-600 py-2.5 px-4 text-sm font-semibold text-white shadow-sm hover:bg-indigo-500 focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-indigo-600 transition"
          >
            データ一覧に戻る
          </a>
          <a
            href="/src/single.html"
            class="flex w-full justify-center rounded-md bg-white py-2.5 px-4 text-sm font-semibold text-gray-900 shadow-sm ring-1 ring-inset ring-gray-300 hover:bg-gray-50 transition"
          >
            更新したデータを確認する
          </a>
        </div>

        <!-- 補足情報 -->
        <div class="mt-8 pt-6 border-t border-gray-100">
          <p class="text-xs text-gray-400">
            自動的に一覧画面へ戻らない場合は、上のボタンをクリックしてください。
          </p>
        </div>
      </div>
    </div>
  </body>
</html>
