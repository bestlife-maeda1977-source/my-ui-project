<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ログアウト完了 | Dashboard System</title>
  </head>
  <body
    class="bg-gradient-to-br from-slate-50 to-indigo-100 min-h-screen flex items-center justify-center p-4"
  >
    <div
      class="max-w-md w-full bg-white/80 backdrop-blur-md rounded-2xl shadow-xl shadow-indigo-500/10 p-8 text-center border border-white"
    >
      <!-- 成功アイコン -->
      <div
        class="mx-auto w-16 h-16 bg-green-100 rounded-full flex items-center justify-center mb-6"
      >
        <svg
          class="w-8 h-8 text-green-600"
          fill="none"
          stroke="currentColor"
          viewBox="0 0 24 24"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2"
            d="M5 13l4 4L19 7"
          ></path>
        </svg>
      </div>

      <h1 class="text-2xl font-bold text-slate-800 mb-2">ログアウトしました</h1>
      <p class="text-slate-600 mb-8">
        ご利用ありがとうございました。<br />またのご利用をお待ちしております。
      </p>

      <!-- アクションボタン -->
      <div class="space-y-4">
        <a
          href="login.html"
          class="block w-full bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-3 rounded-xl transition-all duration-200 shadow-lg shadow-indigo-500/25 active:scale-[0.98]"
        >
          ログイン画面へ戻る
        </a>

        <p class="text-sm text-slate-400">
          <span id="countdown">5</span>秒後に自動的にリダイレクトします
        </p>
      </div>
    </div>

    <script type="module">
      import "./assets/styles/style.css";

      // カウントダウンとリダイレクト処理
      let seconds = 5;
      const countdownEl = document.getElementById("countdown");

      const timer = setInterval(() => {
        seconds--;
        countdownEl.textContent = seconds;
        if (seconds <= 0) {
          clearInterval(timer);
          window.location.href = "login.html"; // リダイレクト先
        }
      }, 1000);
    </script>
  </body>
</html>
