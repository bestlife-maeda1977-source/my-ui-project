<!doctype html>
<html lang="ja" class="h-full bg-gray-50">
  <head>
    <meta charset="UTF-8" />

      <div

          </button>
        </nav>

      <main class="py-10">
        <div class="mx-auto max-w-7xl px-4 sm:px-6 lg:px-8">

          <div class="grid grid-cols-1 lg:grid-cols-2 gap-8">
            <div id="panel-data-a" class="space-y-6 block">
              <section
                class="overflow-hidden bg-white shadow sm:rounded-lg border border-gray-200"
              >
                <div
                  class="px-4 py-4 sm:px-6 bg-slate-50 border-b border-gray-200 flex items-center"
                >
                  <span
                    class="inline-block w-2.5 h-2.5 rounded-full bg-indigo-600 mr-2"
                  ></span>
                  <h3
                    id="panel-title-a"
                    class="text-base font-bold text-gray-900"
                  >
                    データA
                  </h3>
                </div>
                <div class="border-t border-gray-100">
                  <dl class="divide-y divide-gray-100">
                    <div
                      class="px-4 py-4 sm:grid sm:grid-cols-3 sm:gap-4 sm:px-6"
                    >
                      <dt class="text-sm font-medium text-gray-500">ID</dt>
                      <dd
                        id="display-id-a"
                        class="mt-1 text-sm font-mono text-gray-700 sm:col-span-2 sm:mt-0"
                      >
                        --
                      </dd>
                    </div>
                    <div
                      class="px-4 py-4 sm:grid sm:grid-cols-3 sm:gap-4 sm:px-6"
                    >
                      <dt class="text-sm font-medium text-gray-500">
                        データ名
                      </dt>
                      <dd
                        id="display-name-a"
                        class="mt-1 text-sm leading-6 text-gray-700 sm:col-span-2 sm:mt-0"
                      >
                        --
                      </dd>
                    </div>
                    <div
                      class="px-4 py-4 sm:grid sm:grid-cols-3 sm:gap-4 sm:px-6"
                    >
                      <dt class="text-sm font-medium text-gray-500">
                        ステータス
                      </dt>
                      <dd
                        id="display-status-a"
                        class="mt-1 text-sm sm:col-span-2 sm:mt-0"
                      >
                        --
                      </dd>
                    </div>
                    <div
                      class="px-4 py-4 sm:grid sm:grid-cols-3 sm:gap-4 sm:px-6"
                    >
                      <dt class="text-sm font-medium text-gray-500">担当者</dt>
                      <dd
                        id="display-assignee-a"
                        class="mt-1 text-sm leading-6 text-gray-700 sm:col-span-2 sm:mt-0"
                      >
                        --
                      </dd>
                    </div>
                    <div
                      class="px-4 py-4 sm:grid sm:grid-cols-3 sm:gap-4 sm:px-6"
                    >
                      <dt class="text-sm font-medium text-gray-500">
                        発生日時 / 最終更新
                      </dt>
                      <dd
                        id="display-date-a"
                        class="mt-1 text-sm leading-6 text-gray-700 sm:col-span-2 sm:mt-0"
                      >
                        --
                      </dd>
                    </div>
                    <div
                      class="px-4 py-4 sm:grid sm:grid-cols-3 sm:gap-4 sm:px-6"
                    >
                      <dt class="text-sm font-medium text-gray-500">
                        詳細説明
                      </dt>
                      <dd
                        id="display-description-a"
                        class="mt-1 text-sm leading-6 text-gray-700 sm:col-span-2 sm:mt-0 text-pretty break-words"
                      >
                        --
                      </dd>
                    </div>
                    <div class="px-4 py-4 sm:px-6">
                      <dt class="text-sm font-medium text-gray-500 mb-2">
                        生データ / ログ
                      </dt>
                      <dd class="mt-1 text-sm leading-6 text-gray-700">
                        <pre
                          id="display-raw-log-a"
                          class="overflow-auto rounded-md bg-gray-900 p-4 text-xs text-gray-300 font-mono"
                        >
--</pre
                        >
                      </dd>
                    </div>
                  </dl>
                </div>
              </section>
            </div>

            <div id="panel-data-b" class="space-y-6 hidden lg:block">
              <section
                class="overflow-hidden bg-white shadow sm:rounded-lg border border-gray-200"
              >
                <div
                  class="px-4 py-4 sm:px-6 bg-slate-50 border-b border-gray-200 flex items-center"
                >
                  <span
                    class="inline-block w-2.5 h-2.5 rounded-full bg-emerald-500 mr-2"
                  ></span>
                  <h3
                    id="panel-title-b"
                    class="text-base font-bold text-gray-900"
                  >
                    データB
                  </h3>
                </div>
                <div class="border-t border-gray-100">
                  <dl class="divide-y divide-gray-100">
                    <div
                      class="px-4 py-4 sm:grid sm:grid-cols-3 sm:gap-4 sm:px-6"
                    >
                      <dt class="text-sm font-medium text-gray-500">ID</dt>
                      <dd
                        id="display-id-b"
                        class="mt-1 text-sm font-mono text-gray-700 sm:col-span-2 sm:mt-0"
                      >
                        --
                      </dd>
                    </div>
                    <div
                      class="px-4 py-4 sm:grid sm:grid-cols-3 sm:gap-4 sm:px-6"
                    >
                      <dt class="text-sm font-medium text-gray-500">
                        データ名
                      </dt>
                      <dd
                        id="display-name-b"
                        class="mt-1 text-sm leading-6 text-gray-700 sm:col-span-2 sm:mt-0"
                      >
                        --
                      </dd>
                    </div>
                    <div
                      class="px-4 py-4 sm:grid sm:grid-cols-3 sm:gap-4 sm:px-6"
                    >
                      <dt class="text-sm font-medium text-gray-500">
                        ステータス
                      </dt>
                      <dd
                        id="display-status-b"
                        class="mt-1 text-sm sm:col-span-2 sm:mt-0"
                      >
                        --
                      </dd>
                    </div>
                    <div
                      class="px-4 py-4 sm:grid sm:grid-cols-3 sm:gap-4 sm:px-6"
                    >
                      <dt class="text-sm font-medium text-gray-500">担当者</dt>
                      <dd
                        id="display-assignee-b"
                        class="mt-1 text-sm leading-6 text-gray-700 sm:col-span-2 sm:mt-0"
                      >
                        --
                      </dd>
                    </div>
                    <div
                      class="px-4 py-4 sm:grid sm:grid-cols-3 sm:gap-4 sm:px-6"
                    >
                      <dt class="text-sm font-medium text-gray-500">
                        発生日時 / 最終更新
                      </dt>
                      <dd
                        id="display-date-b"
                        class="mt-1 text-sm leading-6 text-gray-700 sm:col-span-2 sm:mt-0"
                      >
                        --
                      </dd>
                    </div>
                    <div
                      class="px-4 py-4 sm:grid sm:grid-cols-3 sm:gap-4 sm:px-6"
                    >
                      <dt class="text-sm font-medium text-gray-500">
                        詳細説明
                      </dt>
                      <dd
                        id="display-description-b"
                        class="mt-1 text-sm leading-6 text-gray-700 sm:col-span-2 sm:mt-0 text-pretty break-words"
                      >
                        --
                      </dd>
                    </div>
                    <div class="px-4 py-4 sm:px-6">
                      <dt class="text-sm font-medium text-gray-500 mb-2">
                        生データ / ログ
                      </dt>
                      <dd class="mt-1 text-sm leading-6 text-gray-700">
                        <pre
                          id="display-raw-log-b"
                          class="overflow-auto rounded-md bg-gray-900 p-4 text-xs text-gray-300 font-mono"
                        >
--</pre
                        >
                      </dd>
                    </div>
                  </dl>
                </div>
              </section>
            </div>
          </div>
        </div>
      </main>
    </div>

    <script type="module">
      import { mockData, STATUS_CONFIG } from "/src/assets/scripts/js/data.js";

      // --- 1. 2つのURLパラメータ (id1, id2) の取得 ---
      const params = new URLSearchParams(window.location.search);
      const id1Param = params.get("id1");
      const id2Param = params.get("id2");

      const storedData =
        JSON.parse(localStorage.getItem("manage_mock_data")) || mockData;

      // ゼロ埋め文字列("0001")や数値(1)の型不一致を防ぐため、双方をNumberに変換して検索
      const itemA = storedData.find((d) => Number(d.id) === Number(id1Param));
      const itemB = storedData.find((d) => Number(d.id) === Number(id2Param));

      // --- 2. メイン処理・UI反映 ---
      if (!itemA || !itemB) {
        const mainElement = document.querySelector("main");
        const missingId = !itemA ? id1Param : id2Param;
        mainElement.innerHTML = `
          <div class="text-center py-20">
            <h2 class="text-xl font-semibold text-gray-900">データが見つかりません</h2>
            <p class="mt-2 text-gray-500">指定されたID（${missingId || "不明"}）のデータが存在しないか、正しく選択されていません。</p>
            <a href="/src/dashboard.html" class="mt-6 inline-flex text-indigo-600 hover:text-indigo-500">ダッシュボードへ戻る</a>
          </div>
        `;
      } else {
        // ステータスバッジ生成用関数
        function createStatusBadge(statusKey) {
          const config = STATUS_CONFIG[statusKey] || {
            text: statusKey,
            class: "bg-gray-100 text-gray-800",
          };
          return `<span class="inline-flex items-center rounded-full px-2.5 py-0.5 text-xs font-medium ${config.class}">${config.text}</span>`;
        }

        // 詳細説明フォーマット用関数
        function formatDescription(text, element) {
          if (text) {
            element.textContent = text;
            element.classList.remove("text-gray-400");
          } else {
            element.textContent = "（説明はありません）";
            element.classList.add("text-gray-400");
          }
        }

        // 【データA】の反映
        document.getElementById("panel-title-a").textContent =
          `データA: ${itemA.name}`;
        document.getElementById("display-id-a").textContent = `#${itemA.id}`;
        document.getElementById("display-name-a").textContent = itemA.name;
        document.getElementById("display-status-a").innerHTML =
          createStatusBadge(itemA.status);
        document.getElementById("display-assignee-a").textContent =
          itemA.assignee || "未定";
        document.getElementById("display-date-a").textContent =
          itemA.updatedAt || itemA.createdAt || "--";
        formatDescription(
          itemA.description,
          document.getElementById("display-description-a"),
        );
        document.getElementById("display-raw-log-a").textContent =
          JSON.stringify(itemA, null, 2);

        // 【データB】の反映
        document.getElementById("panel-title-b").textContent =
          `データB: ${itemB.name}`;
        document.getElementById("display-id-b").textContent = `#${itemB.id}`;
        document.getElementById("display-name-b").textContent = itemB.name;
        document.getElementById("display-status-b").innerHTML =
          createStatusBadge(itemB.status);
        document.getElementById("display-assignee-b").textContent =
          itemB.assignee || "未定";
        document.getElementById("display-date-b").textContent =
          itemB.updatedAt || itemB.createdAt || "--";
        formatDescription(
          itemB.description,
          document.getElementById("display-description-b"),
        );
        document.getElementById("display-raw-log-b").textContent =
          JSON.stringify(itemB, null, 2);

        // スマホ用タブテキストの動的更新
        const tabBtnA = document.getElementById("tab-btn-a");
        const tabBtnB = document.getElementById("tab-btn-b");
        if (tabBtnA) tabBtnA.textContent = itemA.name;
        if (tabBtnB) tabBtnB.textContent = itemB.name;

        // --- 3. スマホ表示用タブ切り替え制御 ---
        const panelA = document.getElementById("panel-data-a");
        const panelB = document.getElementById("panel-data-b");

        function switchTab(activeTab, inactiveTab, showPanel, hidePanel) {
          activeTab.classList.remove(
            "text-gray-500",
            "border-transparent",
            "hover:border-gray-300",
            "hover:text-gray-700",
          );
          activeTab.classList.add("text-indigo-600", "border-indigo-600");

          inactiveTab.classList.remove("text-indigo-600", "border-indigo-600");
          inactiveTab.classList.add(
            "text-gray-500",
            "border-transparent",
            "hover:border-gray-300",
            "hover:text-gray-700",
          );

          showPanel.classList.remove("hidden");
          showPanel.classList.add("block");

          hidePanel.classList.remove("block", "lg:block");
          hidePanel.classList.add("hidden");
        }

        if (tabBtnA && tabBtnB) {
          tabBtnA.addEventListener("click", () => {
            switchTab(tabBtnA, tabBtnB, panelA, panelB);
            panelB.classList.add("lg:block");
          });

          tabBtnB.addEventListener("click", () => {
            switchTab(tabBtnB, tabBtnA, panelB, panelA);
            panelA.classList.add("lg:block");
          });
        }
      }
    </script>
  </body>
</html>
